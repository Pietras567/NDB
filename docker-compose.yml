version: '3.8'

networks:
  cassandra_network:
    driver: bridge

volumes:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data:

services:
  cassandra1:
    image: cassandra:latest
    container_name: cassandra1
    hostname: cassandra1

    volumes:
      - cassandra1_data:/var/lib/cassandra:rw

    restart:
      on-failure

    networks:
      - cassandra_network

    ports:
      - "7000:7000"
      - "9042:9042"

    environment: &environment
      CASSANDRA_SEEDS: "cassandra1,cassandra2,cassandra3"
      CASSANDRA_CLUSTER_NAME: CarRentalCluster
      CASSANDRA_DC: DC1
      CASSANDRA_RACK: RACK1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 128
      CASSANDRA_PASSWORD_SEEDER: yes
      CASSANDRA_USER: carRental
      CASSANDRA_PASSWORD: carRentalPassword
      MAX_HEAP_SIZE: 2G
      HEAP_NEWSIZE: 200M

  cassandra2:
    image: cassandra:latest
    container_name: cassandra2
    hostname: cassandra2

    volumes:
      - cassandra2_data:/var/lib/cassandra:rw

    restart:
      on-failure

    networks:
      - cassandra_network

    ports:
      - "9043:9042"

    environment: *environment

    depends_on:
      cassandra1:
        condition: service_started

  cassandra3:
    image: cassandra:latest
    container_name: cassandra3
    hostname: cassandra3

    volumes:
      - cassandra3_data:/var/lib/cassandra:rw

    restart:
      on-failure

    networks:
      - cassandra_network

    ports:
      - "9044:9042"

    environment: *environment

    depends_on:
      cassandra2:
        condition: service_started