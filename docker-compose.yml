version: '3.8'

services:
  mongo_primary:
    build: .
    image: mongo:8.0.1
    container_name: mongo_primary
    hostname: mongo_primary

    environment:
      - MONGO_INITDB_ROOT_USERNAME=nbd
      - MONGO_INITDB_ROOT_PASSWORD=nbdpassword
      - MONGO_INITDB_ROOT_DATABASE=admin

    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db1
      - ./keyfile:/etc/mongo/keyfile
    command: >
      sh -c "
      chmod 400 /etc/mongo/keyfile &&
      mongod --auth --keyFile /etc/mongo/keyfile --bind_ip_all --port 27017
      "

    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 2s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: '5'
          memory: 8G

    networks:
      - mongonet




  mongo_secondary1:
    build: .
    image: mongo:8.0.1
    container_name: mongo_secondary1
    hostname: mongo_secondary1

    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db2
      - ./keyfile:/etc/mongo/keyfile
    command: >
      sh -c "
      chmod 400 /etc/mongo/keyfile &&
      mongod --auth --keyFile /etc/mongo/keyfile --bind_ip_all --port 27018
      "

    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 2s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: '5'
          memory: 8G

    networks:
      - mongonet


  mongo_secondary2:
    build: .
    image: mongo:8.0.1
    container_name: mongo_secondary2
    hostname: mongo_secondary2

    ports:
      - "27019:27017"
    volumes:
      - mongodb_data:/data/db3
      - ./keyfile:/etc/mongo/keyfile
    command: >
      sh -c "
      chmod 400 /etc/mongo/keyfile &&
      mongod --auth --keyFile /etc/mongo/keyfile --bind_ip_all --port 27019
      "

    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 2s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: '5'
          memory: 8G

    networks:
      - mongonet


  mongodb_setup:
    build: .
    image: mongo:8.0.1
    container_name: mongo_setup
    hostname: mongodb_setup

    volumes:
      - ./keyfile:/etc/mongo/keyfile

    command: >
      sh -c "
      chmod 400 /etc/mongo/keyfile &&
      mongod --bind_ip_all &&

      echo 'Creating admin user...' &&
      mongosh --host mongo_primary:27017 --username nbd --password nbdpassword --authenticationDatabase admin --eval '
        db = db.getSiblingDB(\"admin\");
        db.createUser({
          user: \"nbdAdmin\",
          pwd: \"nbdpassword\",
          roles: [{ role: \"root\", db: \"admin\" }, 
                  { role: \"clusterAdmin\", db: \"admin\" },
                  { role: \"readWrite\", db: \"admin\" },
                  { role: \"dbOwner\", db: \"admin\" },
                  { role: \"dbAdmin\", db: \"admin\" },
                  { role: \"dbAdminAnyDatabase\", db: \"admin\" }]
        });
        print(\"Admin user created\");
      ' &&
      
        until mongosh --host mongo_primary:27017 --username nbd --password nbdpassword --authenticationDatabase admin --eval 'print(\"MongoDB started\")'; do sleep 5; done &&

        echo 'Initiating replica set...' &&
        mongosh --host mongo_primary:27017 --username nbd --password nbdpassword --authenticationDatabase admin --eval '
          rs.initiate({
            _id: \"rs0\",
            members: [
              { _id: 0, host: \"mongo_primary:27017\" },
              { _id: 1, host: \"mongo_secondary1:27018\" },
              { _id: 2, host: \"mongo_secondary2:27019\" }
            ]
          });
        ' &&

        echo 'Adding members to replica set...' &&
        mongosh --host mongo_primary:27017 --username nbd --password nbdpassword --authenticationDatabase admin --eval '
          rs.add(\"mongo_primary:27017\");
          rs.add(\"mongo_secondary1:27018\");
          rs.add(\"mongo_secondary2:27019\");
          rs.status();
        ';
      "

    restart: "no"

    networks:
      - mongonet

    depends_on:
      mongo_primary:
        condition: service_started
      mongo_secondary1:
        condition: service_started
      mongo_secondary2:
        condition: service_started

volumes:
  mongodb_data:

networks:
  mongonet: {}