version: '3.8'

services:
  mongo_primary:
    build: .
    image: mongo:8.0.1
    container_name: mongo_primary
    hostname: mongo_primary

    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_DATABASE=admin

    ports:
      - "27017:27017"

    restart: unless-stopped

    volumes:
      - mongodb_data1:/data/db
      - ./mongod.conf:/etc/mongod.conf
      - ./keyfile:/etc/mongo/keyfile
    command: >
      bash -c "
        mongod --config /etc/mongod.conf --bind_ip_all
        sleep 15;
        mongosh -u admin -p admin --eval '
          db = db.getSiblingDB(\"admin\");
          db.createUser({
            user: \"nbd\",
            pwd: \"nbdpassword\",
            roles: [
              { role: \"root\", db: \"admin\" }, 
              { role: \"clusterAdmin\", db: \"admin\" },
              { role: \"readWrite\", db: \"admin\" },
              { role: \"dbOwner\", db: \"admin\" },
              { role: \"dbAdmin\", db: \"admin\" },
              { role: \"dbAdminAnyDatabase\", db: \"admin\" },
              { role: \"read\", db: \"admin\" },
              { role: \"userAdminAnyDatabase\", db: \"admin\" }
            ],
            mechanisms : [
              \"SCRAM-SHA-1\",
              \"SCRAM-SHA-256\"
            ]
          });
          print(\"Admin user created\");
        ';
      "

    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 2s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: '5'
          memory: 8G

    networks:
      - mongonet




  mongo_secondary1:
    build: .
    image: mongo:8.0.1
    container_name: mongo_secondary1
    hostname: mongo_secondary1

    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_DATABASE=admin

    #depends_on:
    #  mongo_primary:
    #      condition: service_healthy

    ports:
      - "27018:27017"

    restart: unless-stopped

    volumes:
      - mongodb_data2:/data/db
      - ./mongod.conf:/etc/mongod.conf
      - ./keyfile:/etc/mongo/keyfile
    command: >
      bash -c "
        mongod --config /etc/mongod.conf --bind_ip_all
      "

    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 2s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: '5'
          memory: 8G

    networks:
      - mongonet


  mongo_secondary2:
    build: .
    image: mongo:8.0.1
    container_name: mongo_secondary2
    hostname: mongo_secondary2

    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_DATABASE=admin

    ports:
      - "27019:27017"

    restart: unless-stopped
    
    volumes:
      - mongodb_data3:/data/db
      - ./mongod.conf:/etc/mongod.conf
      - ./keyfile:/etc/mongo/keyfile
    command: >
      bash -c "
        mongod --config /etc/mongod.conf --bind_ip_all
      "

    #depends_on:
      #mongo_primary:
      #  condition: service_healthy
      #mongo_secondary1:
      #  condition: service_healthy

    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 2s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: '5'
          memory: 8G

    networks:
      - mongonet


  mongodb_setup:
    build: .
    image: mongo:8.0.1
    container_name: mongo_setup
    hostname: mongodb_setup

    command: >
      bash -c "
        sleep 30;
        echo 'Initiating...' &&
        mongosh --host mongo_primary:27017 --username nbd --password nbdpassword --authenticationDatabase admin --eval '
          db = db.getSiblingDB(\"admin\");
          rs.initiate({
            _id: \"rs0\",
            version: 1,
            members: [
              { _id: 0, host: \"mongo_primary:27017\" },
              { _id: 1, host: \"mongo_secondary1:27018\" },
              { _id: 2, host: \"mongo_secondary2:27019\" }
            ]
          });
  
          rs.add(\"mongo_primary:27017\");
          rs.add(\"mongo_secondary1:27018\");
          rs.add(\"mongo_secondary2:27019\");
          rs.status();
          ';
      "

    restart: "no"

    networks:
      - mongonet

    depends_on:
      mongo_primary:
        condition: service_healthy
      mongo_secondary1:
        condition: service_healthy
      mongo_secondary2:
        condition: service_healthy

volumes:
  mongodb_data1:
  mongodb_data2:
  mongodb_data3:

networks:
  mongonet: {
    driver: bridge
  }